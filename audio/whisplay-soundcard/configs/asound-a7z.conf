# Whisplay Sound Card ALSA configuration for Radxa Cubie A7Z
#
# The A733 vendor I2S controller does not advance dmix/dsnoop timing
# reliably. Use ALSA plug conversion directly on the hardware PCM.

defaults.pcm.rate_converter "speexrate_best"

pcm.!default {
    @args [ CARD DEV ]
    @args.CARD {
        type string
        default "whisplaysound"
    }
    @args.DEV {
        type integer
        default 0
    }
    type asym
    playback.pcm "playback"
    capture.pcm "capture"
}

ctl.!default {
    @args [ CARD ]
    @args.CARD {
        type string
        default "whisplaysound"
    }
    type hw
    card $CARD
}

pcm.whisplaysound {
    type asym
    playback.pcm "playback"
    capture.pcm "capture"
}

ctl.whisplaysound {
    type hw
    card whisplaysound
}

pcm.playback {
    type plug
    slave.pcm "hw:whisplaysound"
}

pcm.capture {
    type plug
    slave.pcm "hw:whisplaysound"
}
